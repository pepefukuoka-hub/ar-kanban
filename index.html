<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181c">
<title>ARかんばん</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="listScreen">
  <header>
    <h1>ARかんばん</h1>
    <span class="count" id="count"></span>
  </header>
  <div class="row">
    <button class="primary" id="newBtn">新しい看板</button>
    <button id="arBtn">ARで見る</button>
  </div>
  <p class="msg" id="listMsg" role="status"></p>
  <ul id="list"></ul>
  <div class="row">
    <button id="exportBtn">書き出し</button>
    <button id="importBtn">読み込み</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</main>

<main id="editScreen" hidden>
  <header><h1 id="editTitle">看板を作る</h1></header>
  <form id="form" novalidate>
    <label for="fName">場所の名前</label>
    <input type="text" id="fName" maxlength="40" autocomplete="off" required>
    <label for="fAccess">アクセス方法</label>
    <textarea id="fAccess" rows="2" maxlength="300"></textarea>
    <label for="fDesc">説明</label>
    <textarea id="fDesc" rows="3" maxlength="600"></textarea>
    <label for="fHeight">浮かせる高さ(メートル)</label>
    <input type="number" id="fHeight" min="0" max="100" step="0.5" value="2" inputmode="decimal">

    <label>位置(地図をタップするか、現在地ボタンで指定)</label>
    <div id="map" role="application" aria-label="位置を選ぶ地図"></div>
    <div class="row">
      <button type="button" id="hereBtn">現在地を入れる</button>
    </div>
    <div class="row two">
      <div><label for="fLat">緯度</label><input type="number" id="fLat" step="any" inputmode="decimal"></div>
      <div><label for="fLng">経度</label><input type="number" id="fLng" step="any" inputmode="decimal"></div>
    </div>
    <p class="msg" id="editMsg" role="status"></p>
    <div class="row">
      <button type="button" id="cancelBtn">やめる</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</main>

<main id="arScreen" hidden>
  <div id="arStart">
    <header><h1>ARで見る</h1></header>
    <p class="help">カメラとコンパスで、近くの看板を現実の景色に重ねます。はじめに、位置情報・カメラ・モーションの許可を求められます。</p>
    <label for="radius">表示する範囲</label>
    <select id="radius">
      <option value="200">半径 200 m</option>
      <option value="500" selected>半径 500 m</option>
      <option value="2000">半径 2 km</option>
      <option value="0">すべて</option>
    </select>
    <label class="help"><input type="checkbox" id="testChars" checked> テストキャラクター(クローズ君)を、東西南北の6m先に出す</label>
    <p class="msg" id="arMsg" role="status"></p>
    <div class="row">
      <button type="button" id="arBack">戻る</button>
      <button type="button" class="primary" id="arGo">ARを開始</button>
    </div>
  </div>
  <div id="arHost"></div>
  <div id="arHud" hidden>
    <button type="button" id="arExit">戻る</button>
    <div id="arNearest"></div>
  </div>
  <div id="arInfo" hidden role="dialog" aria-live="polite">
    <h2 id="infoName"></h2>
    <div class="dist" id="infoDist"></div>
    <h3>アクセス方法</h3>
    <p id="infoAccess"></p>
    <h3>説明</h3>
    <p id="infoDesc"></p>
    <button type="button" class="primary" id="infoClose">閉じる</button>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
